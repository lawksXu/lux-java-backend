name: lux-local
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3.port=8333"]
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${LUX_S3_ACCESS_KEY:?Set LUX_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${LUX_S3_SECRET_KEY:?Set LUX_S3_SECRET_KEY in .env}
      S3_BUCKET: ${LUX_S3_BUCKET:-lux-assets}
    volumes:
      - seaweedfs-data:/data
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: lux
      MYSQL_USER: lux
      MYSQL_PASSWORD: ${LUX_DB_PASSWORD:?Set LUX_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${LUX_DB_ROOT_PASSWORD:?Set LUX_DB_ROOT_PASSWORD in .env}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka-native:4.0.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
volumes:
  seaweedfs-data:
  mysql-data:
  kafka-data:
